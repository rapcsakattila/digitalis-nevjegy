<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
background: #f4f5f7;
color: #20242a;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
padding: 28px 16px;
}

.card {
width: 100%;
max-width: 520px;
background: #ffffff;
border-radius: 26px;
box-shadow: 0 14px 44px rgba(0,0,0,0.10);
overflow: hidden;
text-align: center;
}

.top {
background: linear-gradient(135deg, #f8f8f8, #eceff2);
padding: 46px 26px 34px;
}

.photo {
width: 165px;
height: 165px;
border-radius: 50%;
object-fit: cover;
object-position: center 22%;
border: 6px solid #fff;
box-shadow: 0 8px 24px rgba(0,0,0,0.14);
}

h1 {
margin: 22px 0 8px;
font-size: 32px;
font-weight: 750;
letter-spacing: -0.6px;
}

.title {
margin: 0 auto;
max-width: 400px;
font-size: 18px;
font-weight: 600;
color: #515863;
line-height: 1.45;
}

.content {
padding: 30px 28px 32px;
}

.areas {
display: flex;
flex-wrap: wrap;
justify-content: center;
gap: 8px;
margin-bottom: 28px;
}

.tag {
background: #f1f2f4;
color: #525963;
font-size: 13.5px;
padding: 8px 11px;
border-radius: 999px;
line-height: 1;
}

.contact {
display: flex;
flex-direction: column;
gap: 14px;
margin-bottom: 26px;
}

.contact-item {
display: flex;
align-items: center;
justify-content: center;
gap: 10px;
font-size: 16px;
color: #333940;
}

.contact-item a {
color: inherit;
text-decoration: none;
}

.icon {
width: 20px;
height: 20px;
stroke: currentColor;
stroke-width: 1.8;
fill: none;
stroke-linecap: round;
stroke-linejoin: round;
flex: 0 0 auto;
}

.buttons {
display: grid;
gap: 12px;
}

.button {
display: flex;
align-items: center;
justify-content: center;
gap: 10px;
min-height: 54px;
border-radius: 14px;
text-decoration: none;
font-weight: 650;
font-size: 16px;
transition: 0.15s ease;
cursor: pointer;
border: 0;
font-family: inherit;
}

.primary {
background: #22272e;
color: #fff;
}

.secondary {
background: #f1f2f4;
color: #22272e;
}

.button:hover {
transform: translateY(-1px);
opacity: 0.94;
}

.footer {
margin-top: 28px;
font-size: 12px;
color: #9a9fa6;
}

@media (max-width: 420px) {
body {
padding: 0;
background: #fff;
}

.card {
border-radius: 0;
box-shadow: none;
min-height: 100vh;
}

.photo {
width: 150px;
height: 150px;
}

h1 {
font-size: 29px;
}

.title {
font-size: 17px;
}
}
</style>

<script>
function saveContact() {
const vcard =
`BEGIN:VCARD
VERSION:3.0
N:Rapcsák;Attila;;;
FN:Rapcsák Attila
TITLE:Értékesítési és üzletfejlesztési szakember
TEL;TYPE=CELL:+36709467665
EMAIL;TYPE=INTERNET:attila@rapcsak.eu
URL:https://attila.rapcsak.eu
END:VCARD`;

const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
const url = URL.createObjectURL(blob);

const link = document.createElement("a");
link.href = url;
link.download = "Rapcsak_Attila.vcf";
document.body.appendChild(link);
link.click();
document.body.removeChild(link);

URL.revokeObjectURL(url);
}
</script>
