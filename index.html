<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapcsák Attila | Digitális névjegy</title>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
background: #f3f4f6;
color: #20242a;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
padding: 28px 16px;
}

.card {
width: 100%;
max-width: 520px;
background: #ffffff;
border-radius: 24px;
box-shadow: 0 12px 40px rgba(0,0,0,0.10);
overflow: hidden;
text-align: center;
}

.top {
background: linear-gradient(135deg, #f7f7f7, #e9ecef);
padding: 42px 25px 28px;
}

.photo {
width: 160px;
height: 160px;
border-radius: 50%;
object-fit: cover;
object-position: center 22%;
border: 6px solid white;
box-shadow: 0 7px 22px rgba(0,0,0,0.14);
}

h1 {
margin: 20px 0 7px;
font-size: 31px;
font-weight: 700;
letter-spacing: -0.5px;
}

.title {
margin: 0 auto;
font-size: 17px;
font-weight: 600;
color: #505761;
line-height: 1.45;
}

.content {
padding: 28px;
}

.areas {
color: #626972;
font-size: 14.5px;
line-height: 1.8;
margin-bottom: 28px;
}

.contact {
display: flex;
flex-direction: column;
gap: 12px;
margin-bottom: 24px;
}

.contact-item {
font-size: 16px;
color: #343a40;
}

.contact-item a {
color: inherit;
text-decoration: none;
}

.buttons {
display: grid;
gap: 12px;
}

.button {
display: flex;
align-items: center;
justify-content: center;
gap: 9px;
min-height: 53px;
border-radius: 13px;
text-decoration: none;
font-weight: 600;
font-size: 16px;
transition: 0.15s ease;
cursor: pointer;
border: 0;
font-family: inherit;
}

.primary {
background: #22272e;
color: white;
}

.secondary {
background: #f0f1f3;
color: #22272e;
}

.button:hover {
transform: translateY(-1px);
opacity: 0.92;
}

.footer {
margin-top: 26px;
font-size: 12px;
color: #9a9fa6;
}

@media (max-width: 420px) {
body {
padding: 0;
background: white;
}

.card {
border-radius: 0;
box-shadow: none;
min-height: 100vh;
}

.photo {
width: 145px;
height: 145px;
}

h1 {
font-size: 28px;
}
}
</style>
</head>

<body>

<main class="card">

<section class="top">
<img src="profil.jpg" alt="Rapcsák Attila" class="photo">

<h1>Rapcsák Attila</h1>

<p class="title">
Értékesítési és üzletfejlesztési szakember
</p>
</section>

<section class="content">

<div class="areas">
Ingatlanértékesítés • Ingatlanfejlesztés • Beszerzés • Közbeszerzés •
Egyedi bútortervezés és bútorértékesítés
</div>

<div class="contact">
<div class="contact-item">
📞 <a href="tel:+36709467665">+36 70 946 7665</a>
</div>

<div class="contact-item">
✉️ <a href="mailto:attila@rapcsak.eu">attila@rapcsak.eu</a>
</div>
</div>

<div class="buttons">

<a class="button primary" href="tel:+36709467665">
📞 Hívás
</a>

<a class="button secondary" href="mailto:attila@rapcsak.eu">
✉️ E-mail írása
</a>

<button class="button secondary" onclick="saveContact()">
👤 Névjegy mentése
</button>

</div>

<div class="footer">
Rapcsák Attila • Digitális névjegy
</div>

</section>

</main>

<script>
function saveContact() {

const vcard =
`BEGIN:VCARD
VERSION:3.0
N:Rapcsák;Attila;;;
FN:Rapcsák Attila
TITLE:Értékesítési és üzletfejlesztési szakember
TEL;TYPE=CELL:+36709467665
EMAIL;TYPE=INTERNET:attila@rapcsak.eu
URL:https://attila.rapcsak.eu
END:VCARD`;

const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
const url = URL.createObjectURL(blob);

const link = document.createElement("a");
link.href = url;
link.download = "Rapcsak_Attila.vcf";
document.body.appendChild(link);
link.click();
document.body.removeChild(link);

URL.revokeObjectURL(url);
}
</script>

</body>
</html>
